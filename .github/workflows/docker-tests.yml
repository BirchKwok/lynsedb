name: Docker API Checks

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag or ref to build and test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or ref to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker-api:
    name: Docker API checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test client
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --config-settings=maturin.build-args=--locked .

      - name: Build test image
        run: docker build --tag lynsedb-release-test .

      - name: Start test container
        run: docker run --detach --name lynsedb-release-test --publish 7637:7637 lynsedb-release-test

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7637/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs lynsedb-release-test
          exit 1

      - name: Run Docker API tests
        run: python -m pytest tests/docker_tests -q
        env:
          LYNSE_REMOTE_BASE_URL: http://127.0.0.1:7637

      - name: Show container logs on failure
        if: failure()
        run: docker logs lynsedb-release-test

      - name: Cleanup
        if: always()
        run: docker rm --force lynsedb-release-test
